name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The Kaggle data is downloaded by the tests; keep it between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/kagglehub
          key: kagglehub-${{ hashFiles('data.py') }}
      - run: pytest -v
